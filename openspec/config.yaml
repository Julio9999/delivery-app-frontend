schema: spec-driven

context: |
  Tech stack: React 19 + TypeScript 5.9 + Vite 7 + Tailwind CSS 4
  Architecture: Feature-modular (src/modules/, src/pages/, src/stores/, src/api/)
  UI: shadcn/ui (new-york) + Radix UI + Base UI + CVA + lucide-react
  State: Zustand 5 | Forms: React Hook Form + Zod 4 | Auth: better-auth
  HTTP: Axios | Tables: @tanstack/react-table | Router: React Router 7
  Bundler: Vite 7 | Package manager: Bun | React Compiler: enabled
  Testing: NONE — no test runner, no test files, no coverage tooling
  Style: ESLint 9 + Prettier (printWidth 140) + TypeScript strict

strict_tdd: false

testing:
  runner: null
  framework: null
  command: null
  strict_tdd: false
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: true
      command: "bun run lint"
    type_checker:
      available: true
      command: "tsc -b"
    formatter:
      available: true
      command: "prettier --write ."

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "bun run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

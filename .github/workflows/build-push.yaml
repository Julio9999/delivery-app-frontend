name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/julio9999/delivery-app-panel
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger image update in delivery-infra
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_IMAGE_UPDATE }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG=$(echo "$TAGS" | head -1 | sed 's|.*:||')
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Julio9999/delivery-infra/dispatches" \
            -d "{\"event_type\":\"image-built\",\"client_payload\":{\"image\":\"delivery-app-panel\",\"tag\":\"$TAG\"}}"

name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout delivery-infra
        uses: actions/checkout@v4
        with:
          repository: Julio9999/delivery-infra
          token: ${{ secrets.PAT_TOKEN }}
          path: delivery-infra

      - name: Update image tag in delivery-infra
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cd delivery-infra/apps/frontend
          sed -i "s|image: ghcr.io/julio9999/delivery-app-panel:.*|image: ghcr.io/julio9999/delivery-app-panel:sha-${SHORT_SHA}|" deployment.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          path: delivery-infra
          branch: update-frontend-${{ github.sha }}
          base: main
          title: "chore(frontend): update image to sha-${{ github.sha }}"
          body: |
            Actualización automática del frontend.

            - **Commit**: ${{ github.sha }}
            - **Imagen**: `ghcr.io/julio9999/delivery-app-panel:sha-${{ github.sha }}`
            - **Pipeline**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-message: "chore(frontend): update image to sha-${{ github.sha }}"
          branch-suffix: timestamp
          delete-branch: true
